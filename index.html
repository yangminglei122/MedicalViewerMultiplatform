<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>医学影像浏览器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230d1014'/%3E%3Cpath d='M12 4v16M4 12h16' stroke='%233d7eff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css?v=37">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo">
      <img src="logo.png" alt="logo" class="logo-img">
      <span class="title">医学影像浏览器</span>
    </div>
    <div class="searchbox" id="search-box">
      <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="search" id="search-input" type="search" placeholder="搜索姓名 / ID / 检查">
    </div>
    <div class="spacer"></div>
    <span id="server-badge"></span>
    <div id="user-box"></div>
    <button class="btn primary" id="btn-import">
      <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v10m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      导入
    </button>
  </header>
  <main>
    <!-- 患者列表页(PACS 工作列表) -->
    <section id="page-library">
      <div id="wl-filter"></div>
      <div id="wl-stats" class="muted"></div>
      <div id="library-empty" class="hidden">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5 17l5-4 3 2 4-4 3 3"/></svg>
        <h2>欢迎使用</h2>
        <div class="hint">正在加载…</div>
      </div>
      <div id="wl-table"></div>
    </section>

    <!-- 阅读器页 -->
    <section id="page-viewer" class="hidden">
      <div id="vtoolbar"></div>
      <div id="vmain">
        <aside id="vseries"></aside>
        <div id="vpanes-wrap"><div id="vpanes" class="panes layout-1"></div></div>
      </div>
      <div id="vbottom">
        <span class="inst" id="inst-label">-</span>
        <input type="range" id="inst-slider" min="1" max="1" value="1">
        <button class="btn sm" id="cine-btn">▶ 播放</button>
        <select id="cine-fps" class="input" style="width:64px" title="播放速度(帧/秒)">
          <option>6</option><option>8</option><option selected>12</option><option>16</option><option>24</option><option>30</option>
        </select>
      </div>
    </section>
  </main>
</div>

<!-- 登录层 -->
<div id="login-overlay" class="hidden">
  <form class="modal" id="login-form">
    <div class="login-logo"><img src="logo.png" alt="logo"></div>
    <div class="modal-title" style="text-align:center">医学影像浏览器</div>
    <div class="modal-body">
      <div class="field"><label>用户名</label><input class="input" id="login-user" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input class="input" id="login-pass" type="password" autocomplete="current-password" required></div>
      <div class="muted" style="font-size:12px">首次部署默认管理员:admin / admin,登录后请立即在「账号管理」中修改密码。</div>
    </div>
    <div class="modal-btns"><button class="btn primary" type="submit" style="width:100%">登录</button></div>
  </form>
</div>

<script src="js/vendor/pako.min.js?v=30"></script>
<script src="js/vendor/charls.js?v=30"></script>
<script type="module">
import("./js/vendor/jpeg-lossless.js").then(m => { window.__jpegLossless = m; }).catch(() => { });
</script>
<script src="js/util.js?v=30"></script>
<script src="js/dicom.js?v=30"></script>
<script src="js/decoder.js?v=30"></script>
<script src="js/viewer.js?v=30"></script>
<script src="js/mpr.js?v=30"></script>
<script src="js/api.js?v=30"></script>
<script src="js/import.js?v=30"></script>
<script src="js/library.js?v=30"></script>
<script src="js/dev-gen.js?v=30"></script>
<script src="js/app.js?v=30"></script>
</body>
</html>
